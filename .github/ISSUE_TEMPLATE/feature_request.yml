name: Feature request / design proposal
description: Suggest a MySQL feature, enhancement, or design proposal.
title: "[Feature]: "
labels:
  - enhancement
  - triage-needed
  - design-proposal
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement to MySQL.

        This form follows the MySQL Community Design Proposal structure:
        - Document metadata
        - 1. High-Level Description
        - 2. Requirements
        - 3. Impact Checklist
        - 4. High-Level Specification
        - 5. Low-Level Design
        - 6. QA Notes

        Sections 3 and below are optional. Fill them in when they help reviewers understand the proposal.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing GitHub issues and did not find a duplicate request.
          required: true
        - label: I have removed or redacted sensitive information.
          required: true

  - type: markdown
    attributes:
      value: |
        ## Document metadata

        Capture enough context for reviewers to understand ownership, contact details, status, and intended target release.


  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Draft
        - Under Review
        - Accepted
        - Implemented
    validations:
      required: true

  - type: input
    id: primary_contact_name
    attributes:
      label: Primary contact name
      placeholder: "Full name"
    validations:
      required: true

  - type: input
    id: primary_contact_email
    attributes:
      label: Primary contact email
      placeholder: "name@example.com"
    validations:
      required: true

  - type: input
    id: company_organization
    attributes:
      label: Company / organization
      placeholder: "Example: Oracle, Independent contributor, Partner name"
    validations:
      required: true

  - type: input
    id: role_team
    attributes:
      label: Role / team
      placeholder: "Example: MySQL Server, MySQL Shell, Contributor, DBA, Application Developer"
    validations:
      required: true

  - type: textarea
    id: additional_authors
    attributes:
      label: Additional authors / contributors
      description: List any additional people who contributed to the proposal.
      placeholder: |
        - Name <email@example.com>
        - Name <email@example.com>

  - type: input
    id: proposal_date
    attributes:
      label: Date
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: input
    id: target_release
    attributes:
      label: Target release
      placeholder: "Example: 9.x, future release, not yet known"
    validations:
      required: true

  - type: dropdown
    id: roadmap_section
    attributes:
      label: Roadmap section
      options:
        - AI & Cloud
        - Developer/DBA Experience
        - Extensibility/Ecosystem
        - Performance & Observability
        - Other
    validations:
      required: true

  - type: textarea
    id: related_references
    attributes:
      label: Related issues / PRs / bugs / references
      description: Link to related GitHub issues, pull requests, bugs, worklogs, discussions, standards, or documentation.
      placeholder: |
        - Related issue:
        - Related PR:
        - Related bug:
        - Related documentation:
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 1. High-Level Description

        Keep this section approachable. A reviewer should understand the problem, motivation, and intended scope before reading implementation details.

  - type: textarea
    id: executive_summary
    attributes:
      label: Executive summary
      description: Summarize the proposal in a few paragraphs.
      placeholder: "Describe the problem, motivation, and proposed change."
    validations:
      required: true

  - type: textarea
    id: user_developer_stories
    attributes:
      label: User / developer stories
      description: Describe who needs this and what they are trying to accomplish.
      placeholder: |
        - As a ..., I want ..., so that ...
        - As a ..., I want ..., so that ...
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: In scope
      description: What is included in this proposal?
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope / limitations
      description: What is intentionally excluded, deferred, or limited?
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: high_level_references
    attributes:
      label: References
      description: Include background material, standards, prior work, documentation, discussions, or related implementations.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 2. Requirements

        Use direct, normative language where appropriate. These requirements should satisfy the motivating stories above.

  - type: textarea
    id: functional_requirements
    attributes:
      label: Functional requirements
      description: List the required behavior. Use direct language such as MUST, SHOULD, MAY, or MUST NOT where useful.
      placeholder: |
        - The implementation MUST ...
        - The implementation SHOULD ...
        - The implementation MUST NOT ...
    validations:
      required: true

  - type: textarea
    id: non_functional_requirements
    attributes:
      label: Non-functional requirements
      description: Capture requirements for performance, observability, compatibility, security, usability, operability, or maintainability. Enter "N/A" if none are known.
      placeholder: |
        - Performance:
        - Compatibility:
        - Observability:
        - Security:
        - Operability:
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 3. Impact Checklist

        Optional. Use this as a fast reviewer summary. Every checked item should be explained later in the proposal when possible.

  - type: checkboxes
    id: impact_checklist
    attributes:
      label: Impact areas
      options:
        - label: SQL syntax or statements
        - label: Configuration options or system variables
        - label: Command-line options or utilities
        - label: User-visible behavior
        - label: Observability
        - label: Security or privilege model
        - label: Protocol or replication behavior
        - label: Upgrade / downgrade compatibility
        - label: Performance or resource usage
        - label: Files, persistence, or metadata formats
        - label: APIs or internal interfaces
        - label: Testing or QA coverage needs

  - type: markdown
    attributes:
      value: |
        ## 4. High-Level Specification

        Optional. Explain the design in enough detail for reviewers to evaluate correctness, usability, observability, compatibility, and risk.

  - type: textarea
    id: approach_summary
    attributes:
      label: Summary of the approach
      description: Describe the proposed design at a high level.

  - type: textarea
    id: user_interface
    attributes:
      label: User Interface
      description: Describe the user-facing behavior, SQL, API, CLI, configuration, or operational workflow.

  - type: textarea
    id: configuration_knobs
    attributes:
      label: Configuration / Knobs
      description: Describe new or changed configuration clauses, options, variables, defaults, valid values, and expected behavior.
      placeholder: |
        New configuration clauses or options:

        New system variables or command-line options:

        New command-line options for utilities:

        New UDFs or similar extension points:

        New statements or grammar changes:

  - type: textarea
    id: observability
    attributes:
      label: Observability
      description: Describe logs, metrics, Performance Schema exposure, status variables, instrumentation, diagnostics, or tracing.

  - type: textarea
    id: user_procedure
    attributes:
      label: User procedure
      description: Describe how a user, DBA, operator, or developer would use the feature.

  - type: textarea
    id: security_context
    attributes:
      label: Security context
      description: Describe privilege checks, authentication, authorization, data exposure, or security-sensitive behavior.

  - type: textarea
    id: compatibility_behavior_change
    attributes:
      label: Compatibility and behavior change
      description: Describe compatibility, upgrade, downgrade, replication, cross-version, deprecation, or behavior-change concerns.

  - type: markdown
    attributes:
      value: |
        ## 5. Low-Level Design

        Optional. Use this section when implementation detail is needed for review or handoff.

  - type: textarea
    id: block_diagram
    attributes:
      label: Block diagram
      description: Add a diagram, ASCII sketch, Mermaid diagram, or link if helpful.
      placeholder: |
        ```mermaid
        flowchart TD
          A --> B
        ```

  - type: textarea
    id: interface_specification
    attributes:
      label: Interface specification
      description: Describe internal APIs, public APIs, protocol changes, data structures, file formats, or integration points.

  - type: textarea
    id: implementation_steps
    attributes:
      label: Design / implementation steps
      description: Outline the expected implementation plan or major work items.
      placeholder: |
        1.
        2.
        3.

  - type: markdown
    attributes:
      value: |
        ## 6. QA Notes

        Optional. Capture edge cases and validation considerations without overly constraining independent QA exploration.

  - type: textarea
    id: qa_notes
    attributes:
      label: QA notes
      description: Describe edge cases, test scenarios, regression risks, automation candidates, compatibility tests, or validation concerns.
      placeholder: |
        - Edge cases:
        - Regression risks:
        - Suggested test coverage:
        - Automation candidates:
