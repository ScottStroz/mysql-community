name: New Feature Proposal
description: Propose a new MySQL feature that you intend to design and contribute.
title: "[Proposal]: "
labels:
  - enhancement
  - triage-needed
  - design-proposal

body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new feature for MySQL.

        **This form is intended for contributors who plan to design and implement a new feature.**

        If you simply want to request a new capability or enhancement without proposing a design or implementation, please use the **Feature Request** form instead.

        This proposal follows the MySQL Community Design Proposal process:

        - Document Metadata
        - 1. High-Level Description
        - 2. Requirements (Optional)
        - 3. Impact Checklist (Optional)
        - 4. High-Level Specification (Optional)
        - 5. Low-Level Design (Optional)
        - 6. QA Notes (Optional)

        Only the High-Level Description section is expected for an initial proposal. Additional sections may be completed as the proposal evolves through review.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I have searched existing GitHub issues and did not find a duplicate proposal.
          required: true
        - label: I have removed or redacted sensitive information.
          required: true

  - type: markdown
    attributes:
      value: |
        ## Document Metadata

        Provide enough information so reviewers understand who is proposing the feature and which area of MySQL it affects.

  - type: input
    id: primary_contact_name
    attributes:
      label: Primary Contact Name
      placeholder: Full name
    validations:
      required: true

  - type: input
    id: primary_contact_email
    attributes:
      label: Primary Contact Email
      placeholder: name@example.com
    validations:
      required: true

  - type: input
    id: company_organization
    attributes:
      label: Company / Organization
      placeholder: Oracle, Independent Contributor, Partner, etc.
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role
      placeholder: Software Engineer, DBA, Student, Contributor, etc.
    validations:
      required: true

  - type: textarea
    id: additional_authors
    attributes:
      label: Additional Authors / Contributors
      description: List anyone else contributing to this proposal.
      placeholder: |
        - Name <email@example.com>

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which MySQL component is primarily affected?
      options:
        - Server
        - InnoDB
        - Optimizer
        - Parser
        - Replication
        - Group Replication
        - X Plugin
        - Router
        - Shell
        - Build System
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: target_release
    attributes:
      label: Target Release (Optional)
      description: If you have a target release in mind.
      placeholder: "Example: 9.x, Future Release"
    validations:
      required: false

  - type: dropdown
    id: roadmap_section
    attributes:
      label: Roadmap Section
      options:
        - AI & Cloud
        - Developer/DBA Experience
        - Extensibility/Ecosystem
        - Performance & Observability
        - Other
    validations:
      required: true

  - type: textarea
    id: related_references
    attributes:
      label: Related Issues / Pull Requests / References (Optional)
      description: Include links to any related GitHub issues, pull requests, discussions, standards, or documentation.
      placeholder: |
        - Related Issue:
        - Related Pull Request:
        - Discussion:
        - Documentation:
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 1. High-Level Description

        Describe the problem, motivation, and proposed solution at a high level.
        Reviewers should be able to understand the purpose and scope without implementation details.

  - type: textarea
    id: executive_summary
    attributes:
      label: Executive Summary
      description: Describe the problem, motivation, and proposed solution.
      placeholder: Explain the feature and why it should exist.
    validations:
      required: true

  - type: textarea
    id: user_developer_stories
    attributes:
      label: User / Developer Stories
      description: Describe who benefits from this feature.
      placeholder: |
        - As a ..., I want ..., so that ...
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: Proposed Scope
      description: Describe what this proposal intends to implement.
      placeholder: |
        - ...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope / Future Work
      description: Describe what is intentionally excluded from this proposal.
      placeholder: |
        - ...
    validations:
      required: true

  - type: textarea
    id: high_level_references
    attributes:
      label: References
      description: Background material, standards, prior work, or related implementations.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 2. Requirements (Optional)

        If the expected behavior is already well understood, you may leave this section blank and refine it during design review.

  - type: textarea
    id: functional_requirements
    attributes:
      label: Functional Requirements
      description: Describe the expected behavior using MUST, SHOULD, MAY, or MUST NOT where appropriate.
      placeholder: |
        - The implementation MUST ...
        - The implementation SHOULD ...

  - type: textarea
    id: non_functional_requirements
    attributes:
      label: Non-functional Requirements
      description: Describe performance, compatibility, security, observability, usability, maintainability, or other quality attributes.

  - type: markdown
    attributes:
      value: |
        ## 3. Impact Checklist (Optional)

  - type: checkboxes
    id: impact_checklist
    attributes:
      label: Impact Areas
      options:
        - label: SQL syntax or statements
        - label: Configuration options or system variables
        - label: Command-line options or utilities
        - label: User-visible behavior
        - label: Observability
        - label: Security or privilege model
        - label: Protocol or replication behavior
        - label: Upgrade / downgrade compatibility
        - label: Performance or resource usage
        - label: Files, persistence, or metadata formats
        - label: APIs or internal interfaces
        - label: Testing or QA coverage needs

  - type: markdown
    attributes:
      value: |
        ## 4. High-Level Specification (Optional)

  - type: textarea
    id: approach_summary
    attributes:
      label: Summary of the Approach
      description: Describe the proposed design at a high level.

  - type: textarea
    id: user_interface
    attributes:
      label: User Interface
      description: Describe the user-facing behavior, SQL, API, CLI, configuration, or operational workflow.

  - type: textarea
    id: configuration_knobs
    attributes:
      label: Configuration / Knobs
      description: Describe any new or changed configuration options, system variables, command-line options, SQL syntax, or extension points.

  - type: textarea
    id: observability
    attributes:
      label: Observability
      description: Describe logs, metrics, Performance Schema instrumentation, diagnostics, or tracing.

  - type: textarea
    id: user_procedure
    attributes:
      label: User Procedure
      description: Describe how a user, DBA, operator, or developer would use the feature.

  - type: textarea
    id: security_context
    attributes:
      label: Security Considerations
      description: Describe privilege checks, authentication, authorization, data exposure, or other security-sensitive behavior.

  - type: textarea
    id: compatibility_behavior_change
    attributes:
      label: Compatibility and Behavior Changes
      description: Describe compatibility, upgrade, downgrade, replication, deprecation, or behavior changes.

  - type: markdown
    attributes:
      value: |
        ## 5. Low-Level Design (Optional)

  - type: textarea
    id: block_diagram
    attributes:
      label: Block Diagram
      description: Include a Mermaid diagram, ASCII diagram, or link if helpful.
      placeholder: |
        ```mermaid
        flowchart TD
          A --> B
        ```

  - type: textarea
    id: interface_specification
    attributes:
      label: Interface Specification
      description: Describe internal APIs, public APIs, protocol changes, data structures, file formats, or integration points.

  - type: textarea
    id: implementation_steps
    attributes:
      label: Proposed Implementation Plan
      description: Outline the expected implementation plan or major work items.
      placeholder: |
        1.
        2.
        3.

  - type: markdown
    attributes:
      value: |
        ## 6. QA Notes (Optional)

  - type: textarea
    id: qa_notes
    attributes:
      label: QA Notes
      description: Describe edge cases, regression risks, test scenarios, automation opportunities, compatibility testing, or validation concerns.
      placeholder: |
        - Edge cases:
        - Regression risks:
        - Suggested test coverage:
        - Automation opportunities:
