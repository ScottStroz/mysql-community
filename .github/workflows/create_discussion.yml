name: Create Discussion From Labeled Issue

on:
  issues:
    types:
      - labeled

permissions:
  contents: read
  issues: write
  discussions: write

jobs:
  create-discussion:
    if: contains(
          fromJson('["AI & Cloud","Performance & Observability","Extensibility/Ecosystem","Developer / DBA Experience"]'),
          github.event.label.name
        )

    runs-on: ubuntu-latest

    steps:
      - name: Create Discussion
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelName = context.payload.label.name;
            const issue = context.payload.issue;

            // Skip if we've already created a discussion for this issue
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.user.login === "github-actions[bot]" &&
              comment.body.includes("A discussion has been created for this topic:")
            );

            if (existingComment) {
              core.info("Discussion already exists for this issue. Skipping.");
              return;
            }

            // Look up the repository's discussion categories
            const { repository } = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  id
                  discussionCategories(first: 100) {
                    nodes {
                      id
                      name
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            // Find the discussion category whose name matches the label
            const category = repository.discussionCategories.nodes.find(
              c => c.name === labelName
            );

            if (!category) {
              core.setFailed(`No discussion category named "${labelName}" exists.`);
              return;
            }

            // Replace any leading [Something] tags with [Discussion]
            const title = issue.title.replace(/^(\[[^\]]+\]\s*)+/, "[Discussion] ");

            const body = `
This discussion was automatically created from **Issue #${issue.number}**.

**Original Issue:** ${issue.html_url}

Please use this discussion for community feedback and conversation. The issue remains the authoritative tracking item.
`;

            // Create the discussion
            const result = await github.graphql(`
              mutation(
                $repositoryId: ID!,
                $categoryId: ID!,
                $title: String!,
                $body: String!
              ) {
                createDiscussion(
                  input: {
                    repositoryId: $repositoryId
                    categoryId: $categoryId
                    title: $title
                    body: $body
                  }
                ) {
                  discussion {
                    url
                  }
                }
              }
            `, {
              repositoryId: repository.id,
              categoryId: category.id,
              title: title,
              body: body
            });

            const discussionUrl = result.createDiscussion.discussion.url;

            // Comment on the issue with a link to the discussion
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `💬 A discussion has been created in **${labelName}**:\n\n${discussionUrl}\n\nPlease continue community discussion there while this issue remains the authoritative tracking item.`
            });

            core.info(`Discussion created: ${discussionUrl}`);
